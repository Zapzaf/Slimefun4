options:
  # Instead of disabling Auto Updates consider using the "stable" version of Slimefun.
  # These builds are much more tested and are far less likely to have any issues.
  # Note: When running a stable build auto-updates ONLY update to other stable builds! Perfect eh?
  # You can download the latest stable build here: https://thebusybiscuit.github.io/builds/TheBusyBiscuit/Slimefun4/stable/

  auto-update: true
  chat-prefix: '&a&lSF &7» '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: en
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  # Slimefun items (by ID) that can't be placed down, for example blocks that cost too much
  # performance. They still work otherwise (crafting, as ingredients), and blocks placed before
  # stay where they are. Block Placers can't place them either.
  # Players with the permission slimefun.place.bypass (nobody by default) can still place them.
  # Find an item's ID in Items.yml.
  #
  # By default the cargo network is disabled, because the Networks addon does the same job:
  #   CARGO_MANAGER              -> Network Controller
  #   CARGO_NODE                 -> Network Bridge
  #   CARGO_NODE_INPUT           -> Network Grabber / Vanilla Grabber / Network Importer
  #   CARGO_NODE_OUTPUT          -> Network Pusher / Vanilla Pusher / Network Exporter
  #   CARGO_NODE_OUTPUT_ADVANCED -> Network Pusher (9 filter slots)
  # Keep REACTOR_ACCESS_PORT placeable: reactors only take items through it, also from Networks.
  # The cargo items can still be crafted, because Networks uses them in its recipes.
  # Use [] to allow placing everything.
  disabled-block-placement:
  - CARGO_MANAGER
  - CARGO_NODE
  - CARGO_NODE_INPUT
  - CARGO_NODE_OUTPUT
  - CARGO_NODE_OUTPUT_ADVANCED

  # Slimefun items that are turned off, by their id (the same as enabled: false in Items.yml).
  # They can't be crafted, are hidden from the guide, and copies players already have do nothing.
  # KNOWLEDGE_TOME (Tome of Knowledge Sharing) copies all of one player's researches to another.
  # Use [] to turn nothing off. Changes need a restart.
  disabled-items:
  - KNOWLEDGE_TOME

guide:
  show-vanilla-recipes: true
  receive-on-first-join: true
  show-hidden-item-groups-in-search: false

researches:
  free-in-creative-mode: true
  enable-fireworks: true
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: true
  analytics: true

